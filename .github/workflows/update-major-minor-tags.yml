name: Update major and minor tags

on:
  release:
    types: [published]

permissions: {}

jobs:
  update-tags:
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.release.tag_name }}

      - name: Move compatibility tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          minor="${RELEASE_TAG%.*}"
          major="${minor%.*}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -fa "$minor" -m "Release $RELEASE_TAG"
          git tag -fa "$major" -m "Release $RELEASE_TAG"
          git push --force origin "$minor" "$major"
