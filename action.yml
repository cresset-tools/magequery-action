name: magequery
description: Install magequery and run a static check or query against a Magento 2 project.
author: cresset-tools

branding:
  icon: search
  color: purple

inputs:
  version:
    description: Magequery version to install (for example, 0.7.0), or latest.
    required: false
    default: latest
  checksum:
    description: Optional SHA-256 checksum for the magequery archive; defaults to the release sidecar.
    required: false
  args:
    description: Arguments to pass to magequery.
    required: false
    default: doctor
  root:
    description: Path to the Magento root, relative to the workspace.
    required: false
    default: .
  sarif-file:
    description: >-
      For doctor, also write its findings as a SARIF 2.1.0 log to this path, for
      github/codeql-action/upload-sarif. Written even when doctor fails.
    required: false
    default: ""
  github-token:
    description: Token used to resolve the latest magequery release and download release assets.
    required: false
    default: ${{ github.token }}

outputs:
  magequery-version:
    description: The magequery version that was installed.
  sarif-file:
    description: The SARIF log written, when sarif-file was given.

runs:
  using: node24
  main: dist/index.cjs
